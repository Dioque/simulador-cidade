services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: farol
      POSTGRES_DB: farol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crie o arquivo .env}
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farol -d farol"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  game:
    build: .
    environment:
      DATABASE_URL: postgresql://farol:${POSTGRES_PASSWORD}@db:5432/farol
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      WORKSHOP_GOAL: ${WORKSHOP_GOAL:-2}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      NODE_ENV: ${NODE_ENV:-development}
      BIND_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-3000}:3000"
    restart: unless-stopped
volumes:
  dados:

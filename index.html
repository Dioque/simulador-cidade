<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1e8">
<title>Pixelville | Vale dos Ipês</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand"><span class="mark" aria-hidden="true">▦</span><strong>Pixelville</strong></div>
  <span id="running" class="running"><i></i><span>Simulação ativa</span></span>
</div></header>
<main>
  <section class="intro"><div><p class="eyebrow">OBSERVATÓRIO MUNICIPAL</p><h1>Vale dos Ipês</h1><p class="subtitle">Acompanhe a rotina, a economia e as histórias da cidade.</p></div>
  <div class="clock"><div class="clock-face"><small id="day"></small><strong id="hour"></strong></div><div class="controls"><button id="pause" type="button" aria-label="Pausar"><span aria-hidden="true"></span></button><div id="speeds" aria-label="Velocidade"><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="5">5×</button></div></div></div></section>
  <section class="metrics" aria-label="Indicadores">
    <div><span class="metric-icon peach" aria-hidden="true">◈</span><div><small>Moradores</small><strong id="residents"></strong></div></div>
    <div><span class="metric-icon mint" aria-hidden="true">₡</span><div><small>Tesouro</small><strong id="treasury"></strong></div></div>
    <div><span class="metric-icon blue" aria-hidden="true">▣</span><div><small>Empregos</small><strong id="employed"></strong></div></div>
    <div><span class="metric-icon lilac" aria-hidden="true">✦</span><div><small>Ocorrências abertas</small><strong id="active"></strong></div></div>
  </section>
  <div class="workspace">
    <section class="panel viewport"><div class="panel-head"><h2>Mapa da cidade</h2><span id="period"></span></div>
      <canvas id="map" aria-label="Mapa em pixel art do Vale dos Ipês. Use o seletor de moradores para inspecionar pessoas pelo teclado."></canvas>
      <div class="map-foot"><span>Clique em alguém ou em um prédio para inspecionar.</span><span>32 × 22</span></div>
    </section>
    <aside>
      <section class="panel inspector"><div class="panel-head"><h2>Inspetor</h2><button type="button" id="clear">Limpar</button></div>
        <label class="sr-only" for="find">Buscar morador ou cão</label>
        <select id="find"><option value="">Escolher morador ou cão</option></select>
        <div id="details"></div>
      </section>
      <section class="panel journal"><div class="panel-head"><h2>Diário da cidade</h2></div><ol id="feed"></ol></section>
    </aside>
  </div>
  <footer><span id="summary"></span><div><span id="save"></span><button id="reset" type="button">Reiniciar cidade</button></div></footer>
</main>
</body>
</html>
